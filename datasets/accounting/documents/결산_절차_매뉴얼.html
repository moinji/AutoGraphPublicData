<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결산 절차 매뉴얼</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 800px; margin: auto; padding: 20px; }
        h1 { color: #27ae60; }
        h2 { color: #229954; border-bottom: 2px solid #27ae60; padding-bottom: 5px; }
        .timeline { position: relative; padding: 10px 0; }
        .timeline-item { padding: 10px 20px; margin: 10px 0; background: #eafaf1; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>
    <h1>월말 결산 절차 매뉴얼</h1>

    <h2>결산 일정 (매월)</h2>
    <div class="timeline">
        <div class="timeline-item">
            <strong>D-5 ~ D-3</strong>: 매출/매입 마감 확인, 미처리 전표 입력
        </div>
        <div class="timeline-item">
            <strong>D-2</strong>: 은행 잔액 조정표 작성, 고정자산 감가상각 계상
        </div>
        <div class="timeline-item">
            <strong>D-1</strong>: 수정분개 입력, 잔액시산표 검토
        </div>
        <div class="timeline-item">
            <strong>D-Day</strong>: 재무제표 확정, 경영진 보고
        </div>
        <div class="timeline-item">
            <strong>D+3</strong>: 부가세 신고서 작성 (분기), 원천세 신고
        </div>
    </div>

    <h2>체크리스트</h2>
    <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <tr style="background:#27ae60;color:white;">
            <th>항목</th><th>담당자</th><th>완료</th>
        </tr>
        <tr><td>매출 전표 마감</td><td>영업팀</td><td>☐</td></tr>
        <tr><td>매입 전표 마감</td><td>구매팀</td><td>☐</td></tr>
        <tr><td>급여 대장 확인</td><td>인사팀</td><td>☐</td></tr>
        <tr><td>은행 잔액 조정</td><td>재무팀</td><td>☐</td></tr>
        <tr><td>감가상각비 계상</td><td>재무팀</td><td>☐</td></tr>
        <tr><td>대손충당금 검토</td><td>재무팀</td><td>☐</td></tr>
        <tr><td>재무제표 작성</td><td>재무팀</td><td>☐</td></tr>
    </table>
</body>
</html>
